# Perfil de desenvolvimento: H2 em arquivo local (./data, fora do git).
# Rodar: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:file:./data/financas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.thymeleaf.cache=false

# CSS e JS editados aparecem ao recarregar: o navegador sempre confere se o arquivo mudou.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.chain.cache=false

# Mostra o SQL e as estatísticas do Hibernate para achar N+1.
# Os valores dos parâmetros (dados financeiros) não são registrados.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.stat=debug
