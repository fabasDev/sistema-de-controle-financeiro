spring.application.name=financas

# Banco. Em produção, os valores vêm de variáveis de ambiente e nunca ficam no código.
# Sem elas o app não sobe, de propósito. Para desenvolvimento, use o perfil "dev".
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O esquema é responsabilidade do Flyway. O Hibernate só confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
# Sem consultas durante a renderização da página (evita N+1 escondido no template).
spring.jpa.open-in-view=false

# Paginação: 20 por página, e pedidos acima de 100 são reduzidos para 100.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Sessão: expira com 30 min sem uso, só por cookie (nunca na URL).
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
# Nome genérico (não revela a tecnologia). O prefixo __Host- obriga Secure e Path=/ e impede subdomínios de sobrescrever o cookie.
server.servlet.session.cookie.name=__Host-id

# Arquivos estáticos (Fase 5). CSS e fontes ganham o hash do conteúdo no nome (app-3f2a....css) e
# ficam 1 ano no cache do navegador: quando o arquivo muda, o nome muda junto. O JavaScript usa a
# versão no caminho (ver StaticResourcesConfig). As páginas HTML continuam com no-store.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/fonts/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Compressão (gzip) só de CSS, JavaScript e SVG. HTML e JSON ficam de fora de propósito: eles
# trazem o token CSRF e dados da conta, às vezes ao lado de texto digitado (a busca), que é o
# cenário do ataque BREACH. As fontes woff2 já vêm comprimidas.
server.compression.enabled=true
server.compression.mime-types=text/css,text/javascript,application/javascript,image/svg+xml

# Backup do app antigo: arquivo de até 10 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Erros nunca mostram detalhes internos (já é o padrão, fica explícito).
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false
spring.web.error.whitelabel.enabled=false

# Custo do BCrypt (mínimo 10 pelo Password Storage Cheat Sheet).
app.security.bcrypt-strength=12

# Fuso usado para "hoje" e para o mês atual.
app.time-zone=America/Sao_Paulo
