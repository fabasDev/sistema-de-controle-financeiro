<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:data-theme="${theme}">
<head th:replace="~{fragments/layout :: head('Histórico')}"></head>
<body>
<header th:replace="~{fragments/layout :: appHeader}"></header>
<main id="conteudo" class="page">
    <h1>Histórico</h1>
    <nav aria-label="Período">
        <a th:each="n : ${ {6, 12, 24} }" th:href="@{/historico(meses=${n})}" th:text="${n} + ' meses'"
           th:attr="aria-current=${n == count} ? 'page' : null"></a>
    </nav>

    <p th:if="${!hasData}" class="empty">
        Ainda não há lançamentos nesses meses. Registre seus gastos e receitas e o histórico aparece aqui.
    </p>

    <!-- O gráfico só repete a tabela de baixo em forma visual: a tabela é a versão acessível. -->
    <figure th:if="${hasData}" class="chart">
        <figcaption id="grafico-titulo">Entrou × saiu por mês</figcaption>
        <ul class="chart-legend" aria-hidden="true">
            <li><span class="swatch bar-income"></span>Entrou</li>
            <li><span class="swatch bar-outflow"></span>Saiu (gastos + guardado)</li>
        </ul>
        <svg class="chart-svg" role="img" aria-labelledby="grafico-titulo grafico-desc"
             th:attr="viewBox='0 0 ' + ${chart.width} + ' ' + ${chart.height}">
            <desc id="grafico-desc" th:text="${chart.description}"></desc>
            <g class="chart-grid">
                <th:block th:each="t : ${chart.ticks}">
                    <line th:attr="x1=${chart.plotLeft},x2=${chart.plotRight},y1=${t.y},y2=${t.y}"></line>
                    <text class="chart-tick" text-anchor="end" th:attr="x=${chart.plotLeft - 6},y=${t.y + 4}" th:text="${t.label}"></text>
                </th:block>
            </g>
            <path th:each="b : ${chart.bars}" th:attr="d=${b.path}" th:class="${b.cssClass}"><title th:text="${b.title}"></title></path>
            <line class="chart-baseline" th:attr="x1=${chart.plotLeft},x2=${chart.plotRight},y1=${chart.baseline},y2=${chart.baseline}"></line>
            <text th:each="l : ${chart.xLabels}" class="chart-tick" text-anchor="middle"
                  th:attr="x=${l.x},y=${chart.baseline + 18}" th:text="${l.label}"></text>
        </svg>
    </figure>

    <div class="table-scroll" role="region" aria-label="Entradas × saídas por mês" tabindex="0">
    <table class="table">
        <caption class="small">Entradas × saídas por mês</caption>
        <thead><tr><th scope="col">Mês</th><th scope="col" class="num">Entrou</th><th scope="col" class="num">Gastou</th><th scope="col" class="num">Guardou</th><th scope="col" class="num">Sobrou</th><th scope="col" class="num">Poupança</th></tr></thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <th scope="row" th:text="${@fmt.month(r.month)}"></th>
            <td class="value num" th:text="${@fmt.money(r.income)}"></td>
            <td class="value num" th:text="${@fmt.money(r.spent)}"></td>
            <td class="value num" th:text="${@fmt.money(r.saved)}"></td>
            <td class="value num" th:text="${@fmt.money(r.balance)}"></td>
            <td class="value num" th:text="${@fmt.percent(r.savingsRate)}"></td>
        </tr>
        </tbody>
    </table>
    </div>

    <div th:unless="${#lists.isEmpty(categories)}" class="table-scroll" role="region" aria-label="Gasto por categoria" tabindex="0">
    <table class="table">
        <caption class="small">Gasto por categoria</caption>
        <thead>
        <tr>
            <th scope="col">Categoria</th>
            <th scope="col" class="num" th:each="m : ${months}" th:text="${@fmt.month(m)}"></th>
            <th scope="col" class="num">Total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categories}">
            <th scope="row" th:text="${c.name}"></th>
            <td class="value num" th:each="v : ${c.values}" th:text="${@fmt.money(v)}"></td>
            <td class="value num" th:text="${@fmt.money(c.total)}"></td>
        </tr>
        </tbody>
    </table>
    </div>
    <p th:if="${#lists.isEmpty(categories)}" class="empty">Sem gastos neste período.</p>
</main>
</body>
</html>
