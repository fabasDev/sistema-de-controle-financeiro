<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:data-theme="${theme}">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body class="auth">
<main id="conteudo" class="auth-main">
    <h1>Entrar</h1>

    <p th:if="${param.erro}" class="notice notice-error" role="alert"><svg th:replace="~{fragments/icons :: circleAlert}"></svg> <span>Usuário ou senha incorretos.</span></p>
    <p th:if="${param.bloqueado}" class="notice notice-error" role="alert">
        <svg th:replace="~{fragments/icons :: circleAlert}"></svg> <span>Muitas tentativas. Espere alguns minutos e tente de novo.</span>
    </p>
    <p th:if="${param.saiu}" class="notice" role="status"><svg th:replace="~{fragments/icons :: info}"></svg> <span>Você saiu da sua conta.</span></p>
    <p th:if="${param.expirou}" class="notice" role="status"><svg th:replace="~{fragments/icons :: info}"></svg> <span>Sua sessão expirou. Entre de novo.</span></p>
    <p th:if="${param.excluida}" class="notice" role="status"><svg th:replace="~{fragments/icons :: info}"></svg> <span>Sua conta e todos os dados foram apagados.</span></p>

    <form th:action="@{/login}" method="post" class="form">
        <div class="field">
            <label for="username">Usuário</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none"
                   spellcheck="false" maxlength="60" required autofocus>
        </div>
        <div class="field">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="button-primary">Entrar</button>
    </form>

    <p><a class="link-standalone" th:href="@{/recuperar}">Esqueci a senha</a></p>
    <p>Ainda não tem conta? <a th:href="@{/cadastro}">Criar conta</a></p>
    <p class="small"><a class="link-standalone" th:href="@{/privacidade}">Privacidade</a></p>
</main>
</body>
</html>
