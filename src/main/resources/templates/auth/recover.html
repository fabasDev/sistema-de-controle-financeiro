<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:data-theme="${theme}">
<head th:replace="~{fragments/layout :: head('Recuperar senha')}"></head>
<body class="auth">
<main id="conteudo" class="auth-main">
    <h1>Recuperar senha</h1>
    <p>Use o código de recuperação que apareceu quando você criou a conta.</p>

    <form th:action="@{/recuperar}" th:object="${form}" method="post" class="form">
        <div class="field">
            <label for="username">Usuário</label>
            <input id="username" name="username" type="text" th:value="*{username}" autocomplete="username"
                   autocapitalize="none" spellcheck="false" maxlength="60" required
                   th:attr="aria-invalid=${#fields.hasErrors('username')},aria-describedby=${#fields.hasErrors('username')} ? 'username-erro' : null">
            <p id="username-erro" class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>
        <div class="field">
            <label for="code">Código de recuperação</label>
            <input id="code" name="code" type="text" autocomplete="one-time-code" autocapitalize="characters"
                   spellcheck="false" maxlength="64" required placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"
                   th:attr="aria-invalid=${#fields.hasErrors('code')},aria-describedby=${#fields.hasErrors('code')} ? 'code-erro' : null">
            <p id="code-erro" class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></p>
        </div>
        <div class="field">
            <label for="password">Senha nova</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required
                   th:attr="aria-invalid=${#fields.hasErrors('password')},aria-describedby=${#fields.hasErrors('password')} ? 'password-erro' : 'password-ajuda'">
            <p id="password-ajuda" class="hint">Pelo menos 15 caracteres.</p>
            <p id="password-erro" class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <div class="field">
            <label for="confirm">Repita a senha nova</label>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" required
                   th:attr="aria-invalid=${#fields.hasErrors('confirm')},aria-describedby=${#fields.hasErrors('confirm')} ? 'confirm-erro' : null">
            <p id="confirm-erro" class="field-error" th:if="${#fields.hasErrors('confirm')}" th:errors="*{confirm}"></p>
        </div>
        <button type="submit" class="button-primary">Trocar a senha</button>
    </form>

    <p><a class="link-standalone" th:href="@{/login}">Voltar para entrar</a></p>
</main>
</body>
</html>
