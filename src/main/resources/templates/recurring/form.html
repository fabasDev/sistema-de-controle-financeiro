<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:data-theme="${theme}">
<head th:replace="~{fragments/layout :: head(${editingId} ? 'Editar conta fixa' : 'Nova conta fixa')}"></head>
<body>
<header th:replace="~{fragments/layout :: appHeader}"></header>
<main id="conteudo" class="page">
    <h1 th:text="${editingId} ? 'Editar conta fixa' : 'Nova conta fixa'">Nova conta fixa</h1>
    <p th:if="${editingId}" class="small">Lançamentos ainda não pagos deste mês em diante acompanham a alteração.</p>

    <form th:action="${editingId} ? @{/contas-fixas/{id}(id=${editingId})} : @{/contas-fixas}" th:object="${form}"
          method="post" class="form">
        <fieldset class="field">
            <legend>Tipo</legend>
            <label><input type="radio" name="type" value="EXPENSE" th:checked="*{type?.name() == 'EXPENSE'}"> Despesa</label>
            <label><input type="radio" name="type" value="INCOME" th:checked="*{type?.name() == 'INCOME'}"> Receita</label>
            <p class="field-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>
        </fieldset>

        <div class="field">
            <label for="description">Nome</label>
            <input id="description" name="description" type="text" maxlength="200" th:value="*{description}" required
                   placeholder="Ex.: aluguel, internet, salário"
                   th:attr="aria-invalid=${#fields.hasErrors('description')}">
            <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
        </div>

        <div class="field">
            <label for="amount">Valor (R$)</label>
            <input id="amount" name="amount" type="text" inputmode="decimal" maxlength="20" pattern="[R$ ]*[0-9][0-9.,]*" data-msg-pattern-mismatch="Use só números, como 1.234,56." th:value="*{amount}" required
                   placeholder="0,00" th:attr="aria-invalid=${#fields.hasErrors('amount')}">
            <p class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></p>
        </div>

        <div class="field">
            <label for="categoryId">Categoria <span class="small">(obrigatória na despesa)</span></label>
            <select id="categoryId" name="categoryId" th:attr="aria-invalid=${#fields.hasErrors('categoryId')}">
                <option value="">Escolha…</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == form.categoryId}"></option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></p>
        </div>

        <div class="field">
            <label for="goalId">Meta <span class="small">(opcional)</span></label>
            <select id="goalId" name="goalId">
                <option value="">Nenhuma</option>
                <option th:each="g : ${goals}" th:value="${g.id}" th:text="${g.name}" th:selected="${g.id == form.goalId}"></option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('goalId')}" th:errors="*{goalId}"></p>
        </div>

        <div class="field">
            <label for="dayOfMonth">Dia do mês</label>
            <input id="dayOfMonth" name="dayOfMonth" type="number" inputmode="numeric" min="1" max="31" th:value="*{dayOfMonth}" required>
            <p class="hint">Em meses mais curtos, vira o último dia.</p>
            <p class="field-error" th:if="${#fields.hasErrors('dayOfMonth')}" th:errors="*{dayOfMonth}"></p>
        </div>

        <div class="field">
            <label for="startMonth">Primeiro mês</label>
            <input id="startMonth" name="startMonth" type="month" th:value="*{startMonth}" required>
            <p class="field-error" th:if="${#fields.hasErrors('startMonth')}" th:errors="*{startMonth}"></p>
        </div>

        <div class="field">
            <label for="installments">Parcelas <span class="small">(vazio = sem fim)</span></label>
            <input id="installments" name="installments" type="number" inputmode="numeric" min="2" max="360" th:value="*{installments}">
            <p class="field-error" th:if="${#fields.hasErrors('installments')}" th:errors="*{installments}"></p>        </div>

        <fieldset class="field">
            <legend>Situação</legend>
            <label><input type="radio" name="active" value="true" th:checked="*{active == null or active}"> Ativa</label>
            <label><input type="radio" name="active" value="false" th:checked="*{active != null and !active}"> Pausada</label>
        </fieldset>

        <p>
            <button type="submit" class="button-primary">Salvar</button>
            <a class="link-standalone" th:href="@{/contas-fixas}">Cancelar</a>
        </p>
    </form>
</main>
</body>
</html>
