<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:data-theme="${theme}">
<head th:replace="~{fragments/layout :: head('Apagar conta fixa')}"></head>
<body>
<header th:replace="~{fragments/layout :: appHeader}"></header>
<main id="conteudo" class="page">
    <h1>Apagar conta fixa?</h1>
    <p><strong th:text="${entry.description}"></strong>, <span class="value" th:text="${@fmt.money(entry.amount)}"></span> por mês.</p>
    <p>Os lançamentos futuros ainda não pagos somem. Os que já aconteceram continuam no histórico.</p>
    <form th:action="@{/contas-fixas/{id}/excluir(id=${entry.id})}" method="post">
        <button type="submit" class="button-danger">Apagar</button>
        <a class="link-standalone" th:href="@{/contas-fixas}">Cancelar</a>
    </form>
</main>
</body>
</html>
