<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tema: o escolhido em Ajustes (theme) ou, sem login, o escuro padrão. "system" deixa o aparelho
         decidir. Vem antes do CSS para o navegador já pintar o fundo na cor certa, sem clarão. -->
    <meta name="color-scheme" th:content="${theme == 'light'} ? 'light' : (${theme == 'system'} ? 'light dark' : 'dark')">
    <title th:text="${title} + ' · Finanças'">Finanças</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <!-- Token CSRF para os pedidos feitos pelo JavaScript (fetch). -->
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
    <meta name="_csrf_parameter" th:if="${_csrf}" th:content="${_csrf.parameterName}">
    <!-- A Besley (títulos e valores) aparece no topo de toda tela. Pedida já aqui, chega antes de o CSS
         mandar buscá-la e o título não "pula" quando ela troca a fonte provisória. O crossorigin é
         obrigatório para fonte; sem ele o navegador baixa o arquivo duas vezes. -->
    <link rel="preload" th:href="@{/fonts/besley-latin-wght.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script type="module" th:src="@{/js/app.js}"></script>
</head>
<body>

<!--
  Cabeçalho das telas logadas. Na tela larga ele vira um menu fixo à esquerda, com as telas em
  três grupos. No celular a navegação é uma barra fixa embaixo, perto do polegar: as três telas
  mais usadas e "Mais" (<details>, funciona sem JavaScript), que abre as outras. Só uma das duas
  existe de cada vez para o leitor de tela, porque a outra fica com display: none.
-->
<header th:fragment="appHeader" class="app-header">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <p class="wordmark"><svg th:replace="~{fragments/icons :: wallet}"></svg> Finanças</p>
    <nav class="nav-wide" aria-label="Principal">
        <div th:replace="~{fragments/layout :: navList}"></div>
    </nav>
    <form th:action="@{/logout}" method="post" class="logout">
        <button type="submit" class="button-quiet"><svg th:replace="~{fragments/icons :: logOut}"></svg> Sair</button>
    </form>
    <!-- section: o primeiro trecho do caminho ("/ajustes/exportar" dá "ajustes"). -->
    <nav class="tab-bar" aria-label="Principal"
         th:with="section=${currentPath == null ? '' : #strings.substringBefore(currentPath.substring(1) + '/', '/')}">
        <ul class="tab-list">
            <li th:replace="~{fragments/layout :: tabItem('/', 'Início', 'house')}"></li>
            <li th:replace="~{fragments/layout :: tabItem('/lancamentos', 'Lançamentos', 'list')}"></li>
            <li th:replace="~{fragments/layout :: tabItem('/metas', 'Metas', 'target')}"></li>
            <li>
                <details class="tab-more">
                    <!-- "Mais" fica marcado quando a tela atual é uma das que estão dentro dele. -->
                    <summary th:classappend="${!#strings.isEmpty(section) and #strings.contains(' contas-fixas planejamento investimentos simulador historico ajustes ', ' ' + section + ' ')} ? 'is-current'">
                        <svg th:replace="~{fragments/icons :: ellipsis}"></svg> Mais
                    </summary>
                    <ul class="nav-list tab-sheet">
                        <li th:replace="~{fragments/layout :: navItem('/contas-fixas', 'Contas fixas', 'repeat')}"></li>
                        <li th:replace="~{fragments/layout :: navItem('/planejamento', 'Planejamento', 'chartPie')}"></li>
                        <li th:replace="~{fragments/layout :: navItem('/investimentos', 'Investimentos', 'trendingUp')}"></li>
                        <li th:replace="~{fragments/layout :: navItem('/simulador', 'Simulador', 'calculator')}"></li>
                        <li th:replace="~{fragments/layout :: navItem('/historico', 'Histórico', 'chartColumn')}"></li>
                        <li th:replace="~{fragments/layout :: navItem('/ajustes', 'Ajustes', 'settings')}"></li>
                    </ul>
                </details>
            </li>
        </ul>
    </nav>
</header>

<!-- Menu da tela larga: as telas em grupos, cada lista com o nome do grupo em cima. -->
<div th:fragment="navList" class="nav-groups">
    <p class="nav-group" id="menu-mes">O mês</p>
    <ul class="nav-list" aria-labelledby="menu-mes">
        <li th:replace="~{fragments/layout :: navItem('/', 'Visão geral', 'house')}"></li>
        <li th:replace="~{fragments/layout :: navItem('/lancamentos', 'Lançamentos', 'list')}"></li>
        <li th:replace="~{fragments/layout :: navItem('/contas-fixas', 'Contas fixas', 'repeat')}"></li>
    </ul>
    <p class="nav-group" id="menu-planejar">Planejar</p>
    <ul class="nav-list" aria-labelledby="menu-planejar">
        <li th:replace="~{fragments/layout :: navItem('/planejamento', 'Planejamento', 'chartPie')}"></li>
        <li th:replace="~{fragments/layout :: navItem('/metas', 'Metas', 'target')}"></li>
        <li th:replace="~{fragments/layout :: navItem('/historico', 'Histórico', 'chartColumn')}"></li>
    </ul>
    <p class="nav-group" id="menu-investir">Investir</p>
    <ul class="nav-list" aria-labelledby="menu-investir">
        <li th:replace="~{fragments/layout :: navItem('/investimentos', 'Investimentos', 'trendingUp')}"></li>
        <li th:replace="~{fragments/layout :: navItem('/simulador', 'Simulador', 'calculator')}"></li>
    </ul>
    <ul class="nav-list nav-end">
        <li th:replace="~{fragments/layout :: navItem('/ajustes', 'Ajustes', 'settings')}"></li>
    </ul>
</div>

<!-- Item do menu, com ícone. A página atual ganha aria-current="page"; as telas dentro da seção (editar, novo...), "true". -->
<li th:fragment="navItem(path, label, icon)">
    <a th:href="@{${path}}"
       th:attr="aria-current=${currentPath == path} ? 'page' : (${path != '/' and currentPath != null and #strings.startsWith(currentPath, path + '/')} ? 'true' : null)"><svg th:replace="~{fragments/icons :: __${icon}__}"></svg> <span th:text="${label}">Visão geral</span></a>
</li>

<!-- Item da barra de baixo: ícone em cima, nome embaixo. A tela atual é marcada como no navItem. -->
<li th:fragment="tabItem(path, label, icon)">
    <a th:href="@{${path}}"
       th:attr="aria-current=${currentPath == path} ? 'page' : (${path != '/' and currentPath != null and #strings.startsWith(currentPath, path + '/')} ? 'true' : null)"><svg th:replace="~{fragments/icons :: __${icon}__}"></svg> <span th:text="${label}">Início</span></a>
</li>

<!-- Mensagens de sucesso e erro que vêm de um redirect. O ícone repete o sentido do texto, não o substitui. -->
<div th:fragment="flash">
    <div th:if="${success}" class="notice notice-success" role="status">
        <svg th:replace="~{fragments/icons :: circleCheck}"></svg>
        <span th:text="${success}"></span>
        <form th:if="${undoToken}" th:action="@{/desfazer}" method="post" class="inline">
            <input type="hidden" name="token" th:value="${undoToken}">
            <button type="submit"><svg th:replace="~{fragments/icons :: undo}"></svg> Desfazer</button>
        </form>
    </div>
    <p th:if="${error}" class="notice notice-error" role="alert">
        <svg th:replace="~{fragments/icons :: circleAlert}"></svg>
        <span th:text="${error}"></span>
    </p>
</div>

<!-- Aviso obrigatório em toda sugestão de investimento. -->
<p th:fragment="disclaimer" class="disclaimer">
    Estimativa educativa feita com os seus números. Não é recomendação de investimento.
</p>

</body>
</html>
