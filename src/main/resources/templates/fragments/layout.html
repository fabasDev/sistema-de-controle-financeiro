<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tema claro ou escuro: o escolhido em Ajustes (theme) ou, sem escolha, o do aparelho. Vem antes
         do CSS para o navegador já pintar o fundo na cor certa, sem clarão. -->
    <meta name="color-scheme" th:content="${theme} ?: 'light dark'">
    <title th:text="${title} + ' · Finanças'">Finanças</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <!-- Token CSRF para os pedidos feitos pelo JavaScript (fetch). -->
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
    <meta name="_csrf_parameter" th:if="${_csrf}" th:content="${_csrf.parameterName}">
    <!-- A Besley (títulos e valores) aparece no topo de toda tela. Pedida já aqui, chega antes de o CSS
         mandar buscá-la e o título não "pula" quando ela troca a fonte provisória. O crossorigin é
         obrigatório para fonte; sem ele o navegador baixa o arquivo duas vezes. -->
    <link rel="preload" th:href="@{/fonts/besley-latin-wght.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script type="module" th:src="@{/js/app.js}"></script>
</head>
<body>

<!--
  Cabeçalho das telas logadas. No celular a navegação fica dentro de "Menu" (<details>, funciona
  sem JavaScript); na tela larga ela aparece inteira. As duas usam a mesma lista (navList), e
  só uma existe de cada vez para o leitor de tela, porque a outra fica com display: none.
-->
<header th:fragment="appHeader" class="app-header">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <p class="wordmark">Finanças</p>
    <details class="nav-narrow">
        <summary><svg th:replace="~{fragments/icons :: menu}"></svg> Menu</summary>
        <nav aria-label="Principal">
            <ul th:replace="~{fragments/layout :: navList}"></ul>
        </nav>
    </details>
    <nav class="nav-wide" aria-label="Principal">
        <ul th:replace="~{fragments/layout :: navList}"></ul>
    </nav>
    <form th:action="@{/logout}" method="post" class="logout">
        <button type="submit" class="button-quiet"><svg th:replace="~{fragments/icons :: logOut}"></svg> Sair</button>
    </form>
</header>

<ul th:fragment="navList" class="nav-list">
    <li th:replace="~{fragments/layout :: navItem('/', 'Visão geral')}"></li>
    <li th:replace="~{fragments/layout :: navItem('/lancamentos', 'Lançamentos')}"></li>
    <li th:replace="~{fragments/layout :: navItem('/contas-fixas', 'Contas fixas')}"></li>
    <li th:replace="~{fragments/layout :: navItem('/planejamento', 'Planejamento')}"></li>
    <li th:replace="~{fragments/layout :: navItem('/metas', 'Metas')}"></li>
    <li th:replace="~{fragments/layout :: navItem('/investimentos', 'Investimentos')}"></li>
    <li th:replace="~{fragments/layout :: navItem('/simulador', 'Simulador')}"></li>
    <li th:replace="~{fragments/layout :: navItem('/historico', 'Histórico')}"></li>
    <li th:replace="~{fragments/layout :: navItem('/ajustes', 'Ajustes')}"></li>
</ul>

<!-- Item do menu. A página atual ganha aria-current="page"; as telas dentro da seção (editar, novo...), "true". -->
<li th:fragment="navItem(path, label)">
    <a th:href="@{${path}}" th:text="${label}"
       th:attr="aria-current=${currentPath == path} ? 'page' : (${path != '/' and currentPath != null and #strings.startsWith(currentPath, path + '/')} ? 'true' : null)"></a>
</li>

<!-- Mensagens de sucesso e erro que vêm de um redirect. O ícone repete o sentido do texto, não o substitui. -->
<div th:fragment="flash">
    <div th:if="${success}" class="notice notice-success" role="status">
        <svg th:replace="~{fragments/icons :: circleCheck}"></svg>
        <span th:text="${success}"></span>
        <form th:if="${undoToken}" th:action="@{/desfazer}" method="post" class="inline">
            <input type="hidden" name="token" th:value="${undoToken}">
            <button type="submit"><svg th:replace="~{fragments/icons :: undo}"></svg> Desfazer</button>
        </form>
    </div>
    <p th:if="${error}" class="notice notice-error" role="alert">
        <svg th:replace="~{fragments/icons :: circleAlert}"></svg>
        <span th:text="${error}"></span>
    </p>
</div>

<!-- Aviso obrigatório em toda sugestão de investimento. -->
<p th:fragment="disclaimer" class="disclaimer">
    Estimativa educativa feita com os seus números. Não é recomendação de investimento.
</p>

</body>
</html>
