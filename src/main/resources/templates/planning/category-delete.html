<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Apagar categoria')}"></head>
<body>
<header th:replace="~{fragments/layout :: appHeader}"></header>
<main id="conteudo" class="page">
    <h1>Apagar a categoria <span th:text="${category.name}"></span>?</h1>
    <p>Se ela já tiver lançamentos ou contas fixas, é só arquivada: some dos formulários, mas o histórico continua certo.</p>
    <form th:action="@{/planejamento/categorias/{id}/excluir(id=${category.id})}" method="post">
        <button type="submit" class="button-danger">Apagar</button>
        <a th:href="@{/planejamento}">Cancelar</a>
    </form>
</main>
</body>
</html>
