<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar pote')}"></head>
<body>
<header th:replace="~{fragments/layout :: appHeader}"></header>
<main id="conteudo" class="page">
    <h1>Editar pote</h1>
    <form th:action="@{/planejamento/potes/{id}(id=${bucketId})}" th:object="${form}" method="post" class="form" novalidate>
        <div class="field">
            <label for="name">Nome</label>
            <input id="name" name="name" type="text" maxlength="60" th:value="*{name}" required th:attr="aria-invalid=${#fields.hasErrors('name')}">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div class="field">
            <label for="percent">% da renda</label>
            <input id="percent" name="percent" type="text" inputmode="decimal" maxlength="10" th:value="*{percent}" required th:attr="aria-invalid=${#fields.hasErrors('percent')}">
            <p class="field-error" th:if="${#fields.hasErrors('percent')}" th:errors="*{percent}"></p>
        </div>
        <div class="field">
            <label for="kind">Tipo</label>
            <select id="kind" name="kind">
                <option th:each="k : ${kinds}" th:value="${k}" th:text="${k.label()}" th:selected="${k == form.kind}"></option>
            </select>
            <p class="hint">Mudar o tipo muda também as categorias deste pote. "Futuro" conta como dinheiro guardado.</p>
        </div>
        <div class="field">
            <label for="description">Descrição <span class="small">(opcional)</span></label>
            <input id="description" name="description" type="text" maxlength="500" th:value="*{description}">
        </div>
        <p>
            <button type="submit" class="button-primary">Salvar</button>
            <a th:href="@{/planejamento}">Cancelar</a>
        </p>
    </form>
</main>
</body>
</html>
