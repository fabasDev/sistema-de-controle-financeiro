<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:data-theme="${theme}">
<head th:replace="~{fragments/layout :: head('Planejamento')}"></head>
<body>
<header th:replace="~{fragments/layout :: appHeader}"></header>
<main id="conteudo" class="page">
    <h1>Planejamento</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <section aria-labelledby="regra-titulo">
        <h2 id="regra-titulo">Regra de distribuição da renda</h2>
        <form th:action="@{/planejamento/regra}" method="post" class="form">
            <fieldset class="field">
                <legend>Regras prontas</legend>
                <label th:each="p : ${presets}" class="choice">
                    <input type="radio" name="presetId" th:value="${p.id}" th:checked="${p.id == presetId}">
                    <span><strong th:text="${p.name}"></strong> <span class="hint" th:text="${p.description}"></span></span>
                </label>
            </fieldset>
            <button type="submit">Aplicar regra</button>
        </form>
        <p th:if="${presetId == 'custom'}" class="small">Você está usando uma regra personalizada.</p>

        <table class="table table-stack">
            <thead><tr><th scope="col">Pote</th><th scope="col">Tipo</th><th scope="col" class="num">% da renda</th><th scope="col"><span class="visually-hidden">Ações</span></th></tr></thead>
            <tbody>
            <tr th:each="b : ${buckets}">
                <th scope="row" th:text="${b.name}"></th>
                <td data-label="Tipo" th:text="${b.kind.label()}"></td>
                <td class="value num" data-label="% da renda" th:text="${@fmt.number(b.percent)} + '%'"></td>
                <td class="row-actions">
                    <a th:href="@{/planejamento/potes/{id}/editar(id=${b.id})}"><svg th:replace="~{fragments/icons :: pencil}"></svg> Editar<span class="visually-hidden" th:text="' ' + ${b.name}"></span></a>
                    <a data-delete th:if="${#lists.size(buckets) > 1}" th:href="@{/planejamento/potes/{id}/excluir(id=${b.id})}"><svg th:replace="~{fragments/icons :: trash}"></svg> Remover<span class="visually-hidden" th:text="' ' + ${b.name}"></span></a>
                </td>
            </tr>
            </tbody>
            <tfoot>
            <tr><th scope="row" colspan="2">Total</th><td class="value num" th:text="${@fmt.number(total)} + '%'"></td><td></td></tr>
            </tfoot>
        </table>
        <p th:if="${!totalIs100}" class="notice notice-error" role="status">
            <svg th:replace="~{fragments/icons :: circleAlert}"></svg>
            <span>Os potes somam <span th:text="${@fmt.number(total)}"></span>%, não 100%.</span>
        </p>
        <div class="actions">
            <form th:action="@{/planejamento/potes/normalizar}" method="post" class="inline">
                <button type="submit">Ajustar para somar 100%</button>
            </form>
            <form th:if="${#lists.size(buckets) < maxBuckets}" th:action="@{/planejamento/potes}" method="post" class="inline">
                <button type="submit"><svg th:replace="~{fragments/icons :: plus}"></svg> Adicionar pote</button>
            </form>
        </div>
    </section>

    <section aria-labelledby="cat-titulo">
        <h2 id="cat-titulo">Categorias</h2>
        <p><a class="button-primary" th:href="@{/planejamento/categorias/nova}"><svg th:replace="~{fragments/icons :: plus}"></svg> Nova categoria</a></p>
        <table class="table table-stack">
            <thead><tr><th scope="col">Categoria</th><th scope="col">Pote</th><th scope="col" class="num">Limite mensal</th><th scope="col"><span class="visually-hidden">Ações</span></th></tr></thead>
            <tbody>
            <tr th:each="c : ${categories}">
                <th scope="row">
                    <span th:text="${c.name}"></span>
                    <span th:if="${c.archived}" class="small">(arquivada)</span>
                </th>
                <td data-label="Pote" th:text="${c.bucket.name}"></td>
                <td class="value num" data-label="Limite mensal" th:text="${c.budget} ? ${@fmt.money(c.budget)} : 'sem limite'"></td>
                <td class="row-actions">
                    <a th:href="@{/planejamento/categorias/{id}/editar(id=${c.id})}"><svg th:replace="~{fragments/icons :: pencil}"></svg> Editar<span class="visually-hidden" th:text="' ' + ${c.name}"></span></a>
                    <a data-delete th:unless="${c.archived}" th:href="@{/planejamento/categorias/{id}/excluir(id=${c.id})}"><svg th:replace="~{fragments/icons :: trash}"></svg> Apagar<span class="visually-hidden" th:text="' ' + ${c.name}"></span></a>
                    <form th:if="${c.archived}" th:action="@{/planejamento/categorias/{id}/reativar(id=${c.id})}" method="post" class="inline">
                        <button type="submit">Reativar<span class="visually-hidden" th:text="' ' + ${c.name}"></span></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
