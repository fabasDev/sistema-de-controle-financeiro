# Testes: H2 em memória no modo PostgreSQL, com as mesmas migrações do Flyway.
spring.datasource.url=jdbc:h2:mem:financas-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Necessário para o teste que conta queries (N+1).
spring.jpa.properties.hibernate.generate_statistics=true

# Hash mais barato só nos testes, para não deixar a suíte lenta. Produção usa 19 MiB, 2 iterações e BCrypt 12.
app.security.argon2-memory-kib=1024
app.security.argon2-iterations=1
app.security.bcrypt-strength=4
